AWSTemplateFormatVersion: '2010-09-09'
Description: Bug report tool - DynamoDB table, Lambda function, and IAM role

Resources:

  BugReportsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub
        - BugReports-${Suffix}
        - Suffix: !Select [0, !Split ["-", !Select [2, !Split ["/", !Ref "AWS::StackId"]]]]
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: ticketId
          AttributeType: S
      KeySchema:
        - AttributeName: ticketId
          KeyType: HASH

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub
        - create-bug-report-role-${Suffix}
        - Suffix: !Select [0, !Split ["-", !Select [2, !Split ["/", !Ref "AWS::StackId"]]]]
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBPutItem
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: dynamodb:PutItem
                Resource: !GetAtt BugReportsTable.Arn

  CreateBugReportFunction:
    Type: AWS::Lambda::Function
    DependsOn: LambdaExecutionRole
    Properties:
      FunctionName: !Sub
        - create-bug-report-${Suffix}
        - Suffix: !Select [0, !Split ["-", !Select [2, !Split ["/", !Ref "AWS::StackId"]]]]
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          TABLE_NAME: !Ref BugReportsTable
      Code:
        ZipFile: |
${create_bug_report}

  BedrockInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt CreateBugReportFunction.Arn
      Action: lambda:InvokeFunction
      Principal: bedrock.amazonaws.com

Outputs:
  BugReportsTableArn:
    Description: ARN of the BugReports DynamoDB table
    Value: !GetAtt BugReportsTable.Arn

  LambdaFunctionArn:
    Description: ARN of the create-bug-report Lambda function
    Value: !GetAtt CreateBugReportFunction.Arn

  LambdaExecutionRoleArn:
    Description: ARN of the Lambda execution IAM role
    Value: !GetAtt LambdaExecutionRole.Arn